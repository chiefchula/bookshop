{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body">
        <h4>Sign In</h4>
        <form method="post">
          {{ form.hidden_tag() }}
          <div class="mb-3">{{ form.username.label }} {{ form.username(class='form-control') }}</div>
          <div class="mb-3">{{ form.password.label }} {{ form.password(class='form-control') }}</div>
          <button class="btn btn-primary w-100">{{ form.submit.label.text }}</button>
          <div class="text-center mt-3">
            <a href="{{ url_for('register') }}">Don't have an account? Register</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
